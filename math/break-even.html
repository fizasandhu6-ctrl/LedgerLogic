<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Break-Even & Profit Visualizer | LedgerLogic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f1115; color: #eaeaea; padding: 40px 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 26px; margin-bottom: 6px; }
  p.subtitle { color: #9aa0a6; margin-bottom: 30px; }

  .panel {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }

  .inputs {
    flex: 1;
    min-width: 260px;
    background: #1a1d24;
    padding: 24px;
    border-radius: 10px;
  }

  .field { margin-bottom: 18px; }
  label { display: block; font-size: 14px; color: #b6bcc4; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #333844;
    background: #0f1115;
    color: #fff;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: #5b8def; }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #5b8def;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #4a78d9; }

  .results {
    flex: 1;
    min-width: 260px;
    background: #1a1d24;
    padding: 24px;
    border-radius: 10px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #2a2e37;
    font-size: 15px;
  }
  .result-row span:last-child { font-weight: 600; }

  .status {
    margin-top: 16px;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
  }
  .status.neutral { background: #2a2e37; color: #9aa0a6; }

  .graph-wrap {
    margin-top: 30px;
    background: #1a1d24;
    padding: 20px;
    border-radius: 10px;
  }

  canvas {
    width: 100%;
    height: 400px;
    background: #0f1115;
    border-radius: 6px;
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Break-Even & Profit Visualizer</h1>
  <p class="subtitle">LedgerLogic &mdash; Math Module &mdash; Co-ordinate Geometry in action</p>

  <div class="panel">

    <div class="inputs">
      <div class="field">
        <label for="fixedCost">Fixed Cost (Rs.)</label>
        <input type="number" id="fixedCost" placeholder="e.g. 2000">
      </div>

      <div class="field">
        <label for="variableCost">Variable Cost per Unit (Rs.)</label>
        <input type="number" id="variableCost" placeholder="e.g. 20">
      </div>

      <div class="field">
        <label for="sellingPrice">Selling Price per Unit (Rs.)</label>
        <input type="number" id="sellingPrice" placeholder="e.g. 40">
      </div>

      <button id="calculateBtn">Calculate & Plot</button>
    </div>

    <div class="results">
      <div class="result-row">
        <span>Break-Even Quantity</span>
        <span id="beQuantity">—</span>
      </div>
      <div class="result-row">
        <span>Break-Even Revenue</span>
        <span id="beRevenue">—</span>
      </div>
      <div class="result-row">
        <span>TC Equation</span>
        <span id="tcEquation">—</span>
      </div>
      <div class="result-row">
        <span>TR Equation</span>
        <span id="trEquation">—</span>
      </div>

      <div class="status neutral" id="statusBox">Enter values above and click Calculate</div>
    </div>

  </div>

  <div class="graph-wrap">
    <canvas id="graphCanvas"></canvas>
  </div>
</div>

<script src="break-even.js"></script>
</body>
</html>
